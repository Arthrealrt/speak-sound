name: Windows checks
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c requirements-lock.txt numpy scipy PyAudioWPatch webrtcvad-wheels huggingface-hub requests PySide6-Essentials
      - run: python -m compileall -q speak_sound tools tests
      - run: python -m unittest discover -s tests -v
